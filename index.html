          <h3>NIT Patna Marketplace</h3>
          <p>Full-stack campus marketplace built by Pratham Raj on the MERN stack with JWT auth, OTP-verified @nitp.ac.in signup, and role-based access for 1,000+ NIT Patna students. Features Resend API &amp; OTP verification, Cloudinary CDN image pipeline, and PWA chat with read receipts.</p>
          <p>Tech: React, Node.js, MongoDB | <a href="https://github.com/Pratham2411/nit_patna_market">GitHub</a> | <a href="https://nit-patna-market.vercel.app">Live</a></p>

          <h3>VectorForge — C++ Vector DB &amp; RAG</h3>
          <p>Multi-threaded vector database built by Pratham Raj with HNSW, KD-Tree, and brute-force K-NN search. Local RAG pipeline via Ollama with a 15-route REST API. Features HNSW graph (M=16, efsearch=50), Ollama embeddings + Llama 3.2, and PCA scatter-plot visualization.</p>
          <p>Tech: C++17, HNSW, RAG | <a href="https://github.com/Pratham2411/VectorForge">GitHub</a></p>

          <h3>NetSentry — Deep Packet Inspection</h3>
          <p>Multi-threaded DPI engine built by Pratham Raj, parsing PCAP captures, inspecting TCP/UDP payloads at Layer 4–7, and extracting TLS SNI to classify encrypted traffic. 100% blocking accuracy on test PCAPs.</p>
          <p>Tech: C++17, libpcap, Multi-threading | <a href="https://github.com/Pratham2411/NetSentry">GitHub</a></p>
