<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06100e"/>
      <stop offset="1" stop-color="#07141a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10e7b0"/>
      <stop offset="1" stop-color="#04d9ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#10e7b0" opacity="0.8"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)" opacity="0.15"/>

  <!-- grid -->
  <g opacity="0.12" stroke="#10e7b0" stroke-width="0.5">
    <path d="M0 40 H640 M0 80 H640 M0 120 H640 M0 160 H640 M0 200 H640 M0 240 H640 M0 280 H640 M0 320 H640"/>
    <path d="M40 0 V360 M80 0 V360 M120 0 V360 M160 0 V360 M200 0 V360 M240 0 V360 M280 0 V360 M320 0 V360 M360 0 V360 M400 0 V360 M440 0 V360 M480 0 V360 M520 0 V360 M560 0 V360 M600 0 V360"/>
  </g>

  <!-- title -->
  <text x="32" y="36" fill="#10e7b0" font-family="monospace" font-size="13" font-weight="700" letter-spacing="0.12em">NETSENTRY  DPI PIPELINE</text>
  <text x="32" y="56" fill="#6b7a74" font-family="monospace" font-size="10">C++17 · libpcap · multi-threaded</text>

  <!-- PCAP input -->
  <rect x="32" y="100" width="88" height="52" rx="10" fill="#0a1614" stroke="#10e7b0" stroke-width="1.2" opacity="0.9"/>
  <text x="76" y="122" fill="#fafafa" font-family="monospace" font-size="11" text-anchor="middle" font-weight="700">PCAP</text>
  <text x="76" y="138" fill="#6b7a74" font-family="monospace" font-size="9" text-anchor="middle">capture file</text>

  <!-- Reader -->
  <rect x="148" y="100" width="88" height="52" rx="10" fill="#0a1614" stroke="url(#accent)" stroke-width="1.2"/>
  <text x="192" y="122" fill="#fafafa" font-family="monospace" font-size="11" text-anchor="middle" font-weight="700">Reader</text>
  <text x="192" y="138" fill="#6b7a74" font-family="monospace" font-size="9" text-anchor="middle">producer</text>

  <!-- Load Balancer -->
  <rect x="264" y="100" width="108" height="52" rx="10" fill="#0a1614" stroke="url(#accent)" stroke-width="1.2"/>
  <text x="318" y="122" fill="#fafafa" font-family="monospace" font-size="11" text-anchor="middle" font-weight="700">Load Balancer</text>
  <text x="318" y="138" fill="#6b7a74" font-family="monospace" font-size="9" text-anchor="middle">hash affinity</text>

  <!-- Workers -->
  <g filter="url(#glow)">
    <rect x="400" y="78" width="88" height="40" rx="8" fill="#0c1a18" stroke="#04d9ff" stroke-width="1"/>
    <text x="444" y="102" fill="#fafafa" font-family="monospace" font-size="10" text-anchor="middle">Worker 1</text>
    <rect x="400" y="126" width="88" height="40" rx="8" fill="#0c1a18" stroke="#04d9ff" stroke-width="1"/>
    <text x="444" y="150" fill="#fafafa" font-family="monospace" font-size="10" text-anchor="middle">Worker 2</text>
    <rect x="400" y="174" width="88" height="40" rx="8" fill="#0c1a18" stroke="#04d9ff" stroke-width="1"/>
    <text x="444" y="198" fill="#fafafa" font-family="monospace" font-size="10" text-anchor="middle">Worker N</text>
  </g>
  <text x="444" y="232" fill="#6b7a74" font-family="monospace" font-size="9" text-anchor="middle">fast path</text>

  <!-- TLS/SNI -->
  <rect x="520" y="100" width="88" height="52" rx="10" fill="#0a1614" stroke="#10e7b0" stroke-width="1.2"/>
  <text x="564" y="118" fill="#fafafa" font-family="monospace" font-size="10" text-anchor="middle" font-weight="700">TLS / SNI</text>
  <text x="564" y="134" fill="#6b7a74" font-family="monospace" font-size="9" text-anchor="middle">L4L7 inspect</text>
  <text x="564" y="146" fill="#10e7b0" font-family="monospace" font-size="8" text-anchor="middle">HTTPS classify</text>

  <!-- arrows main flow -->
  <g stroke="#10e7b0" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.75">
    <line x1="120" y1="126" x2="146" y2="126"/>
    <line x1="236" y1="126" x2="262" y2="126"/>
    <line x1="372" y1="126" x2="398" y2="126"/>
    <line x1="488" y1="126" x2="518" y2="126"/>
  </g>

  <!-- fan-out to workers -->
  <g stroke="#04d9ff" stroke-width="1" opacity="0.5" fill="none">
    <path d="M372 126 C385 98 390 98 398 98"/>
    <path d="M372 126 L398 146"/>
    <path d="M372 126 C385 194 390 194 398 194"/>
  </g>

  <!-- Output writer -->
  <rect x="264" y="260" width="108" height="52" rx="10" fill="#0a1614" stroke="url(#accent)" stroke-width="1.2"/>
  <text x="318" y="282" fill="#fafafa" font-family="monospace" font-size="11" text-anchor="middle" font-weight="700">Output Writer</text>
  <text x="318" y="298" fill="#6b7a74" font-family="monospace" font-size="9" text-anchor="middle">classified flows</text>

  <!-- worker to output -->
  <g stroke="#04d9ff" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.6">
    <path d="M444 214 C444 240 380 260 318 260" fill="none"/>
  </g>

  <!-- layer labels -->
  <g font-family="monospace" font-size="9" fill="#4a5a54">
    <text x="32" y="200">L2/L3</text>
    <text x="32" y="214">frames</text>
    <text x="564" y="200">L7</text>
    <text x="564" y="214">payload</text>
  </g>

  <!-- packet dots decoration -->
  <circle cx="130" cy="126" r="3" fill="#10e7b0" opacity="0.8"/>
  <circle cx="250" cy="126" r="3" fill="#10e7b0" opacity="0.8"/>
  <circle cx="370" cy="126" r="3" fill="#04d9ff" opacity="0.8"/>
  <circle cx="505" cy="126" r="3" fill="#10e7b0" opacity="0.8"/>

  <!-- bottom legend -->
  <rect x="32" y="310" width="10" height="10" rx="2" fill="#10e7b0" opacity="0.6"/>
  <text x="48" y="319" fill="#6b7a74" font-family="monospace" font-size="9">producer-consumer queue</text>
  <rect x="220" y="310" width="10" height="10" rx="2" fill="#04d9ff" opacity="0.6"/>
  <text x="236" y="319" fill="#6b7a74" font-family="monospace" font-size="9">parallel workers</text>
  <rect x="380" y="310" width="10" height="10" rx="2" fill="#10e7b0" opacity="0.3" stroke="#10e7b0"/>
  <text x="396" y="319" fill="#6b7a74" font-family="monospace" font-size="9">TLS SNI extraction</text>
</svg>
